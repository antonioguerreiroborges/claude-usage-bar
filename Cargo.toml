[package]
name = "usage-bar-rs"
version = "0.1.0"
edition = "2021"
description = "Barra de uso da janela de 5 horas do Claude Code, sobre a barra de tarefas do Windows"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
raw-window-handle = "0.6"
# native-tls = Schannel no Windows, o mesmo TLS do navegador e do curl.exe
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
dirs = "5"
log = "0.4"
simplelog = "0.12"
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
